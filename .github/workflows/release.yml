name: Build & Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release folder
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "billcat-windows.zip"

      - name: Get version from tag
        id: version
        run: echo "VERSION=$($env:GITHUB_REF -replace 'refs/tags/', '')" >> $env:GITHUB_OUTPUT

      - name: Compile EXE installer
        # windows-latest ships Inno Setup 6 preinstalled.
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BillCat ${{ steps.version.outputs.VERSION }} - Windows POS"
          body: |
            ## What's new
            See commit history for changes.

            ## Install
            - **New install**: download `BillCat-Setup-*.exe` and run it (no admin rights needed)
            - **Existing users**: update banner will appear in the app automatically

          files: |
            installer_output/*.exe
            billcat-windows.zip

      # The zip is served from Supabase, not from the GitHub release asset.
      # github.com redirects asset downloads to release-assets.githubusercontent.com,
      # a separate domain that some ISPs and office firewalls block while
      # leaving github.com reachable. Shops on such a network saw the update
      # banner (the feed read fine), then "check your internet connection" on
      # every download. Every client already reaches this Supabase bucket -
      # that is where it just read the feed from - so serving the zip beside
      # the feed removes the second domain from the path entirely.
      # The GitHub release asset stays published, as the manual fallback.
      - name: Upload release zip to Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}" -replace '^v', ''
          $headers = @{
            "Authorization" = "Bearer $env:SUPABASE_SERVICE_KEY"
            "Content-Type"  = "application/zip"
            "x-upsert"      = "true"
          }
          # Versioned name, so a client that is mid-download when the next
          # release lands keeps pulling the build it started on.
          Invoke-WebRequest -Uri "https://xawpxbhglzhaibmcpwho.supabase.co/storage/v1/object/billcat-updates/billcat-windows-$version.zip" `
            -Method POST -Headers $headers -InFile "billcat-windows.zip" -UseBasicParsing

          # The .exe installer too: the website's download button sends people
          # to the GitHub asset, which redirects to the same blocked domain.
          # A shop that cannot self-update could not download the manual
          # installer either - both routes out were shut.
          $exeHeaders = @{
            "Authorization" = "Bearer $env:SUPABASE_SERVICE_KEY"
            "Content-Type"  = "application/vnd.microsoft.portable-executable"
            "x-upsert"      = "true"
          }
          Invoke-WebRequest -Uri "https://xawpxbhglzhaibmcpwho.supabase.co/storage/v1/object/billcat-updates/BillCat-Setup-$version.exe" `
            -Method POST -Headers $exeHeaders -InFile "installer_output/BillCat-Setup-$version.exe" -UseBasicParsing

      - name: Update Supabase update feed
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}" -replace '^v', ''
          $tag = "${{ steps.version.outputs.VERSION }}"
          $downloadUrl = "https://xawpxbhglzhaibmcpwho.supabase.co/storage/v1/object/public/billcat-updates/billcat-windows-$version.zip"
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"

          # installer_url is what the website's download button uses, so a
          # visitor on a network that blocks the GitHub asset domain can still
          # get the installer.
          $installerUrl = "https://xawpxbhglzhaibmcpwho.supabase.co/storage/v1/object/public/billcat-updates/BillCat-Setup-$version.exe"

          $body = @{
            version        = $version
            download_url   = $downloadUrl
            installer_url  = $installerUrl
            release_notes  = "See the release notes: $releaseUrl"
            mandatory      = $false
          } | ConvertTo-Json -Compress

          $headers = @{
            "Authorization" = "Bearer $env:SUPABASE_SERVICE_KEY"
            "Content-Type"  = "application/json"
            "x-upsert"      = "true"
          }

          Invoke-WebRequest -Uri "https://xawpxbhglzhaibmcpwho.supabase.co/storage/v1/object/billcat-updates/version-windows.json" `
            -Method POST -Headers $headers -Body $body -UseBasicParsing
